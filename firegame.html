<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AndikaChat - Komunitas Andika</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --utama: #5865F2;
            --gelap: #1E1F22;
            --sedang: #2B2D31;
            --terang: #313338;
            --batas: #3F4147;
            --teks: #E0E0E0;
            --abu: #949BA4;
            --merah: #ED4245;
            --hijau: #57F287;
        }

        body {
            background: var(--gelap);
            color: var(--teks);
            height: 100vh;
            overflow: hidden;
        }

        .halaman-auth {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, var(--utama) 0%, #404EED 100%);
        }

        .kotak-auth {
            background: var(--terang);
            padding: 2.5rem;
            border-radius: 10px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .kotak-auth h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: white;
        }

        .kotak-auth input {
            width: 100%;
            padding: 12px 14px;
            margin: 8px 0;
            background: var(--sedang);
            border: 1px solid var(--batas);
            border-radius: 6px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .kotak-auth input:focus {
            border-color: var(--utama);
        }

        .kotak-auth button {
            width: 100%;
            padding: 12px;
            background: var(--utama);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }

        .kotak-auth button:hover {
            background: #4752C4;
        }

        .kotak-auth .pindah, .link-lupa {
            margin-top: 1rem;
            text-align: center;
            font-size: 14px;
            color: var(--abu);
        }

        .kotak-auth span {
            color: var(--utama);
            cursor: pointer;
        }

        /* === CAPTCHA === */
        .kotak-capcha {
            background: white;
            color: black;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 8px;
            text-align: center;
            padding: 12px;
            border-radius: 6px;
            margin: 10px 0;
            user-select: none;
            font-style: italic;
            text-decoration: line-through;
            position: relative;
            overflow: hidden;
        }
        .kotak-capcha::before, .kotak-capcha::after{
            content:"";
            position:absolute;
            width:100%;
            height:2px;
            background:#333;
            top:30%;
            transform:rotate(15deg);
        }
        .kotak-capcha::after{ top:65%; transform:rotate(-20deg); }

        .sembunyi { display: none !important; }
        .pesan { margin-top: 10px; font-size: 14px; text-align: center; min-height: 20px; }
        .sukses { color: var(--hijau); }
        .gagal { color: var(--merah); }

        /* ===== TATA LETAK UTAMA CHAT ===== */
        .tata-letak {
            display: grid;
            grid-template-columns: 240px 1fr;
            height: 100vh;
        }
        .samping {
            background: var(--sedang);
            padding: 1rem;
            border-right: 1px solid var(--batas);
            position: relative;
        }
        .samping h2 {
            font-size: 18px;
            margin-bottom: 1.5rem;
            color: white;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--batas);
        }
        .channel {
            padding: 10px 14px;
            margin: 6px 0;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--abu);
        }
        .channel.aktif, .channel:hover {
            background: var(--terang);
            color: white;
        }
        .channel.kunci::after { content: "🔒"; font-size: 12px; margin-left: auto; }
        .info-pengguna {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            width: calc(240px - 2rem);
            padding-top: 1rem;
            border-top: 1px solid var(--batas);
            font-size: 13px;
            color: var(--abu);
        }
        .info-pengguna button, .btn-ubah-nama {
            margin-top: 6px;
            width: 100%;
            padding: 7px;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-ubah-nama { background: #404249; margin-bottom:4px; }
        .btn-ubah-nama:hover { background: #4a4c55; }
        .info-pengguna button { background: var(--merah); }

        .area-chat { display: flex; flex-direction: column; background: var(--terang); }
        .atas-chat {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--batas);
            font-size: 17px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .daftar-pesan {
            flex: 1;
            padding: 1rem 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .pesan-baris { display: flex; gap: 12px; }
        .pesan-pemilik span {
            background: var(--utama);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            margin-left: 6px;
        }
        .isi-pesan img { max-width: 400px; border-radius: 8px; margin-top: 6px; }
        .nama-pengguna { font-weight: 500; font-size: 15px; }
        .teks-pesan { font-size: 14px; margin-top: 3px; line-height: 1.5; color: #F2F3F5; }
        .bawah-kirim {
            padding: 1rem 1.5rem;
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px solid var(--batas);
        }
        .bawah-kirim input {
            flex: 1;
            padding: 14px 16px;
            background: var(--sedang);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            outline: none;
        }
        .bawah-kirim button, .tombol-gambar {
            padding: 10px 18px;
            background: var(--utama);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }
        .tombol-gambar { background: var(--sedang); border: 1px solid var(--batas); }
        .bawah-kirim button:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
    </style>
</head>
<body>

<div class="halaman-auth" id="halamanAuth">
    <div class="kotak-auth">
        <h2>Selamat Datang</h2>

        <!-- FORM DAFTAR -->
        <div id="formDaftar">
            <input type="text" id="namaDaftar" placeholder="Nama Panggilan / Nama Tampilan">
            <input type="email" id="emailDaftar" placeholder="Alamat Email">
            <input type="password" id="sandiDaftar" placeholder="Kata Sandi">
            <button onclick="kirimKode()">Kirim Kode Verifikasi</button>

            <div class="sembunyi" id="bagianKode">
                <input type="text" id="masukkanKode" placeholder="Masukkan Kode 6 Angka">
                <button onclick="konfirmasiDaftar()">Konfirmasi & Buat Akun</button>
            </div>

            <div class="pesan" id="pesanDaftar"></div>
            <div class="pindah">Sudah punya akun? <span onclick="tukarKeMasuk()">Masuk disini</span></div>
        </div>

        <!-- FORM LOGIN -->
        <div class="sembunyi" id="formMasuk">
            <input type="email" id="emailMasuk" placeholder="Alamat Email">
            <input type="password" id="sandiMasuk" placeholder="Kata Sandi">
            <button onclick="masukAkun()">Masuk</button>
            <div class="link-lupa"><span onclick="bukaLupaSandi()">Lupa sandi?</span></div>
            <div class="pesan" id="pesanMasuk"></div>
            <div class="pindah">Belum punya akun? <span onclick="tukarKeDaftar()">Daftar disini</span></div>
        </div>

        <!-- FORM LUPA SANDI + CAPTCHA -->
        <div class="sembunyi" id="formLupa">
            <h2>Pulihkan Akun</h2>
            <input type="email" id="emailLupa" placeholder="Masukkan email kamu">

            <div class="kotak-capcha" id="tampilCapcha"></div>
            <div style="text-align:right; margin:-6px 0 6px 0; font-size:13px;">
                <span onclick="buatCapchaBaru()">🔄 Ganti teks</span>
            </div>
            <input type="text" id="jawabCapcha" placeholder="Ketik teks di atas disini">

            <button onclick="cekLupaSandi()">Kirim Kode Atur Ulang</button>

            <div class="sembunyi" id="bagianReset">
                <input type="text" id="kodeReset" placeholder="Masukkan Kode">
                <input type="password" id="sandiBaru" placeholder="Sandi Baru">
                <button onclick="simpanSandiBaru()">Ganti Sandi</button>
            </div>

            <div class="pesan" id="pesanLupa"></div>
            <div class="pindah"><span onclick="tukarKeMasuk()">Kembali ke halaman masuk</span></div>
        </div>
    </div>
</div>

<div class="sembunyi" id="halamanUtama">
    <div class="tata-letak">
        <div class="samping">
            <h2>FIREGAMERWEB</h2>
            <div class="channel aktif" data-channel="general" onclick="pindahChannel('general')"># general</div>
            <div class="channel kunci" data-channel="informasi" onclick="pindahChannel('informasi')"># informasi</div>
            <div class="channel" data-channel="art" onclick="pindahChannel('art')"># art</div>

            <div class="info-pengguna">
                <div id="namaPenggunaTampil">Anda: -</div>
                <button class="btn-ubah-nama" onclick="ubahNamaTampil()">✏️ Ubah Nama Tampilan</button>
                <button onclick="keluarAkun()">Keluar Akun</button>
            </div>
        </div>

        <div class="area-chat">
            <div class="atas-chat" id="judulChannel"># general — Tempat ngobrol semua orang</div>
            <div class="daftar-pesan" id="kotakPesan"></div>
            <div class="bawah-kirim">
                <input type="file" accept="image/*" id="pilihGambar" class="sembunyi" onchange="unggahGambar(this)">
                <button class="tombol-gambar" onclick="document.getElementById('pilihGambar').click()">🖼️</button>
                <input type="text" id="inputPesan" placeholder="Tulis pesan..." onkeypress="if(event.key === 'Enter') kirimPesan()">
                <button id="tombolKirim" onclick="kirimPesan()">Kirim</button>
            </div>
        </div>
    </div>
</div>

<script>
// === KONFIGURASI UTAMA ===
const PEMILIK_EMAIL = "andikaleonel22@gmail.com";
let penggunaSaatIni = null;
let channelSaatIni = "general";
let kodeSementara = null, emailSementara = null, sandiSementara = null, namaSementara = null, kodeResetSementara = null;
let teksCapchaBenar = "";

// === PENYIMPANAN DATA ===
function ambilData() { 
    try { return JSON.parse(localStorage.getItem('dataPengguna') || '[]'); }
    catch { return []; }
}
function simpanData(data) { localStorage.setItem('dataPengguna', JSON.stringify(data)); }

// ✅ FUNGSI SIMPAN & AMBIL SESI LOGIN (FITUR BARU)
function simpanSesiLogin(email) {
    localStorage.setItem('sesiLogin', email);
}
function hapusSesiLogin() {
    localStorage.removeItem('sesiLogin');
}
function cekSesiTersimpan() {
    return localStorage.getItem('sesiLogin');
}

let semuaPesan;
try {
    semuaPesan = JSON.parse(localStorage.getItem('pesanObrolan'));
} catch {
    semuaPesan = null;
}
if(!semuaPesan) {
    semuaPesan = {
        general: [], 
        informasi: [{
            email: PEMILIK_EMAIL, 
            nama: "Pemilik",
            pesan: "👋 Selamat datang di FIREGAMER! Hanya pemilik yang bisa kirim pesan disini.", 
            waktu: new Date().toLocaleString()
        }], 
        art: []
    };
}
function simpanPesan() { localStorage.setItem('pesanObrolan', JSON.stringify(semuaPesan)); }

// === FUNGSI CAPCHA ===
function buatCapchaAcak(panjang=6){
    const huruf = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789";
    let hasil = "";
    for(let i=0; i<panjang; i++) hasil += huruf[Math.floor(Math.random()*huruf.length)];
    return hasil;
}
function buatCapchaBaru(){
    teksCapchaBenar = buatCapchaAcak();
    document.getElementById('tampilCapcha').textContent = teksCapchaBenar;
}
function tampilPesan(elemen, teks, berhasil){ 
    elemen.textContent = teks; 
    elemen.className = `pesan ${berhasil?'sukses':'gagal'}`; 
}

// === PERPINDAAN HALAMAN ===
function sembunyikanSemuaForm(){
    document.getElementById('formDaftar').classList.add('sembunyi');
    document.getElementById('formMasuk').classList.add('sembunyi');
    document.getElementById('formLupa').classList.add('sembunyi');
    document.getElementById('bagianKode').classList.add('sembunyi');
    document.getElementById('bagianReset').classList.add('sembunyi');
}
function resetBantuDaftar(){ 
    kodeSementara = emailSementara = sandiSementara = namaSementara = null; 
}

function tukarKeMasuk(){
    sembunyikanSemuaForm();
    document.getElementById('formMasuk').classList.remove('sembunyi');
    document.getElementById('pesanMasuk').textContent = '';
    resetBantuDaftar();
}
function tukarKeDaftar(){
    sembunyikanSemuaForm();
    document.getElementById('formDaftar').classList.remove('sembunyi');
    document.getElementById('pesanDaftar').textContent = '';
}
function bukaLupaSandi(){
    sembunyikanSemuaForm();
    document.getElementById('formLupa').classList.remove('sembunyi');
    document.getElementById('bagianReset').classList.add('sembunyi');
    document.getElementById('pesanLupa').textContent = '';
    buatCapchaBaru();
}

// === SISTEM DAFTAR & KODE VERIFIKASI ===
function kirimKode(){
    let nama = document.getElementById('namaDaftar').value.trim();
    let email = document.getElementById('emailDaftar').value.trim();
    let sandi = document.getElementById('sandiDaftar').value.trim();
    let kotakPesan = document.getElementById('pesanDaftar');

    if(!nama || !email || !sandi) return tampilPesan(kotakPesan, "❌ Isi semua kolom dulu!", false);
    if(nama.length < 2) return tampilPesan(kotakPesan, "❌ Nama minimal 2 huruf!", false);
    if(ambilData().find(a => a.email === email)) return tampilPesan(kotakPesan, "❌ Email sudah terdaftar!", false);

    kodeSementara = Math.floor(100000 + Math.random() * 900000).toString();
    namaSementara = nama; 
    emailSementara = email; 
    sandiSementara = sandi;

    console.log(`✅ Kode verifikasi: ${kodeSementara}`);
    tampilPesan(kotakPesan, `✅ Kode sudah dibuat! Lihat kode disini: ${kodeSementara}`, true);
    document.getElementById('bagianKode').classList.remove('sembunyi');
}

function konfirmasiDaftar(){
    let masukan = document.getElementById('masukkanKode').value.trim();
    let kotakPesan = document.getElementById('pesanDaftar');

    if(masukan === kodeSementara){
        let daftar = ambilData();
        daftar.push({email: emailSementara, sandi: sandiSementara, nama: namaSementara});
        simpanData(daftar);
        tampilPesan(kotakPesan, "🎉 Akun berhasil dibuat! Silakan masuk.", true);
        setTimeout(tukarKeMasuk, 1500);
    } else {
        tampilPesan(kotakPesan, "❌ Kode salah! Coba lagi.", false);
    }
}

// === FITUR LUPA SANDI ===
function cekLupaSandi(){
    let email = document.getElementById('emailLupa').value.trim();
    let jawaban = document.getElementById('jawabCapcha').value.trim();
    let akun = ambilData().find(a => a.email === email);
    let kotakPesan = document.getElementById('pesanLupa');

    if(jawaban !== teksCapchaBenar) {
        tampilPesan(kotakPesan, "❌ Teks gambar salah! Coba lagi.", false);
        buatCapchaBaru(); 
        return;
    }
    if(!akun) { 
        tampilPesan(kotakPesan, "❌ Email tidak ditemukan di sistem.", false); 
        buatCapchaBaru();
        return; 
    }

    kodeResetSementara = Math.floor(100000 + Math.random() * 900000).toString();
    console.log(`✅ Kode Reset Sandi: ${kodeResetSementara}`);
    tampilPesan(kotakPesan, `✅ Benar! Kode reset: ${kodeResetSementara}`, true);
    document.getElementById('bagianReset').classList.remove('sembunyi');
}

function simpanSandiBaru(){
    let email = document.getElementById('emailLupa').value.trim();
    let kodeMasuk = document.getElementById('kodeReset').value.trim();
    let sandiBaru = document.getElementById('sandiBaru').value.trim();
    let kotakPesan = document.getElementById('pesanLupa');

    if(kodeMasuk !== kodeResetSementara) return tampilPesan(kotakPesan, "❌ Kode salah!", false);
    if(!sandiBaru || sandiBaru.length < 4) return tampilPesan(kotakPesan, "❌ Sandi terlalu pendek! Minimal 4 karakter.", false);

    let data = ambilData();
    let idx = data.findIndex(a => a.email === email);
    if(idx !== -1){ 
        data[idx].sandi = sandiBaru; 
        simpanData(data); 
    }
    tampilPesan(kotakPesan, "✅ Sandi berhasil diganti! Silakan login.", true);
    setTimeout(tukarKeMasuk, 1500);
}

// === FUNGSI BANTU PENGGUNA ===
function ambilNama(email){
    let pengguna = ambilData().find(a => a.email === email);
    return pengguna ? pengguna.nama : "Anonim";
}

// === LOGIN & HALAMAN UTAMA ===
function masukAkun(){
    let email = document.getElementById('emailMasuk').value.trim();
    let sandi = document.getElementById('sandiMasuk').value.trim();
    let pengguna = ambilData().find(a => a.email === email && a.sandi === sandi);
    
    if(pengguna){
        penggunaSaatIni = email;
        simpanSesiLogin(email); // ✅ SIMPAN SESI SAAT BERHASIL LOGIN
        bukaHalamanUtama();
    } else {
        tampilPesan(document.getElementById('pesanMasuk'), "❌ Email atau sandi salah!", false);
    }
}

function bukaHalamanUtama(){
    document.getElementById('halamanAuth').classList.add('sembunyi');
    document.getElementById('halamanUtama').classList.remove('sembunyi');
    let namaSaya = ambilNama(penggunaSaatIni);
    let tambah = penggunaSaatIni === PEMILIK_EMAIL ? " 👑 Pemilik" : "";
    document.getElementById('namaPenggunaTampil').textContent = `${namaSaya}${tambah}`;
    muatUlangPesan();
}

function ubahNamaTampil(){
    let namaBaru = prompt("Masukkan nama baru yang kamu inginkan:");
    if(!namaBaru || namaBaru.trim().length < 2) return alert("❌ Nama minimal 2 huruf!");
    namaBaru = namaBaru.trim();

    let data = ambilData();
    let idx = data.findIndex(a => a.email === penggunaSaatIni);
    if(idx !== -1){
        data[idx].nama = namaBaru;
        simpanData(data);
        bukaHalamanUtama();
    }
}

function keluarAkun(){
    penggunaSaatIni = null;
    hapusSesiLogin(); // ✅ HAPUS SESI SAAT KELUAR
    document.getElementById('halamanUtama').classList.add('sembunyi');
    document.getElementById('halamanAuth').classList.remove('sembunyi');
    sembunyikanSemuaForm(); 
    tukarKeMasuk();
}

// === FUNGSI KIRIM & MUAT PESAN ===
function cekBolehKirim() {
    return !(channelSaatIni === 'informasi' && penggunaSaatIni !== PEMILIK_EMAIL);
}

function muatUlangPesan(){
    const kotak = document.getElementById('kotakPesan');
    kotak.innerHTML = '';

    semuaPesan[channelSaatIni].forEach(baris => {
        let elemen = document.createElement('div');
        elemen.className = `pesan-baris ${baris.email === PEMILIK_EMAIL ? 'pesan-pemilik' : ''}`;
        elemen.innerHTML = `
            <div class="isi-pesan">
                <div class="nama-pengguna">${baris.nama}${baris.email === PEMILIK_EMAIL ? '<span>Pemilik</span>' : ''}</div>
                <div class="teks-pesan">${baris.pesan}</div>
            </div>
        `;
        kotak.appendChild(elemen);
    });
    kotak.scrollTop = kotak.scrollHeight;

    const tombolKirim = document.getElementById('tombolKirim');
    const inputPesan = document.getElementById('inputPesan');
    const tombolGambar = document.querySelector('.tombol-gambar');
    if(cekBolehKirim()){
        tombolKirim.disabled = false;
        inputPesan.disabled = false;
        tombolGambar.disabled = false;
    } else {
        tombolKirim.disabled = true;
        inputPesan.disabled = true;
        tombolGambar.disabled = true;
    }
}

function kirimPesan(){
    if(!cekBolehKirim()) return;
    let isi = document.getElementById('inputPesan').value.trim();
    if(!isi) return;

    semuaPesan[channelSaatIni].push({
        email: penggunaSaatIni,
        nama: ambilNama(penggunaSaatIni),
        pesan: isi,
        waktu: new Date().toLocaleString()
    });
    simpanPesan();
    document.getElementById('inputPesan').value = '';
    muatUlangPesan();
}

function unggahGambar(input){
    if(!cekBolehKirim() || !input.files || !input.files[0]) return;
    let berkas = input.files[0];
    let pembaca = new FileReader();
    pembaca.onload = function(e){
        semuaPesan[channelSaatIni].push({
            email: penggunaSaatIni,
            nama: ambilNama(penggunaSaatIni),
            pesan: `<img src="${e.target.result}" alt="Gambar">`,
            waktu: new Date().toLocaleString()
        });
        simpanPesan();
        muatUlangPesan();
    };
    pembaca.readAsDataURL(berkas);
    input.value = '';
}

function pindahChannel(nama){
    channelSaatIni = nama;
    document.querySelectorAll('.channel').forEach(el => el.classList.remove('aktif'));
    document.querySelector(`[data-channel="${nama}"]`).classList.add('aktif');
    
    let info = {
        general: "Tempat ngobrol semua orang", 
        informasi: "Hanya pemilik boleh kirim pesan", 
        art: "Bagikan karya gambarmu!"
    };
    document.getElementById('judulChannel').textContent = `# ${nama} — ${info[nama]}`;
    muatUlangPesan();
}

// ✅ FITUR UTAMA: PERIKSA SESI LOGIN OTOMATIS SAAT HALAMAN DIBUKA
window.onload = function() {
    const emailTersimpan = cekSesiTersimpan();
    if(emailTersimpan) {
        const akunValid = ambilData().find(a => a.email === emailTersimpan);
        if(akunValid) {
            penggunaSaatIni = emailTersimpan;
            bukaHalamanUtama();
        } else {
            hapusSesiLogin();
        }
    }
};
</script>
